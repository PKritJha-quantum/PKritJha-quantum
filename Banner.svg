<svg width="1000" height="240" viewBox="0 0 1000 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Deep Obsidian & Emerald Cyberpunk Base -->
    <linearGradient id="bg" x1="0" y1="0" x2="1000" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#050807"/>
      <stop offset="50%" stop-color="#091A14"/>
      <stop offset="100%" stop-color="#120E06"/>
    </linearGradient>

    <!-- Animated Gold & Emerald Border -->
    <linearGradient id="cyberBorder" x1="0" y1="0" x2="1000" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981">
        <animate attributeName="stop-color" values="#10B981;#F59E0B;#10B981" dur="5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#F59E0B">
        <animate attributeName="stop-color" values="#F59E0B;#10B981;#F59E0B" dur="5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#10B981">
        <animate attributeName="stop-color" values="#10B981;#F59E0B;#10B981" dur="5s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Subtle Cyberpunk Grid Pattern -->
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#10B981" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Card Background & Grid -->
  <rect width="1000" height="240" rx="14" fill="url(#bg)"/>
  <rect width="1000" height="240" rx="14" fill="url(#grid)"/>
  <rect x="2" y="2" width="996" height="236" rx="12" stroke="url(#cyberBorder)" stroke-width="2.5"/>

  <!-- Cyberpunk Corner Brackets -->
  <path d="M 16 40 L 16 16 L 40 16" stroke="#FBBF24" stroke-width="3"/>
  <path d="M 984 200 L 984 224 L 960 224" stroke="#10B981" stroke-width="3"/>

  <!-- Floating Pixelated Sandust / Stardust Particles -->
  <rect x="140" y="200" width="3" height="3" fill="#FBBF24">
    <animate attributeName="y" values="220;20" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.9;0" dur="6s" repeatCount="indefinite"/>
  </rect>
  <rect x="320" y="210" width="4" height="4" fill="#10B981">
    <animate attributeName="y" values="230;30" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.8;0" dur="8s" repeatCount="indefinite"/>
  </rect>
  <rect x="520" y="190" width="3" height="3" fill="#F59E0B">
    <animate attributeName="y" values="225;15" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;0" dur="5s" repeatCount="indefinite"/>
  </rect>
  <rect x="680" y="215" width="4" height="4" fill="#34D399">
    <animate attributeName="y" values="235;25" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.75;0" dur="7s" repeatCount="indefinite"/>
  </rect>
  <rect x="760" y="180" width="3" height="3" fill="#FBBF24">
    <animate attributeName="y" values="210;40" dur="4.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.9;0" dur="4.5s" repeatCount="indefinite"/>
  </rect>

  <!-- Vertical Cyberpunk Laser Scanner -->
  <line x1="0" y1="0" x2="1000" y2="0" stroke="#10B981" stroke-opacity="0.35" stroke-width="2">
    <animate attributeName="y1" values="10;230;10" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="y2" values="10;230;10" dur="7s" repeatCount="indefinite"/>
  </line>

  <!-- Rotating HUD Rings Behind Fox -->
  <circle cx="870" cy="120" r="76" stroke="#10B981" stroke-opacity="0.3" stroke-width="1.5" stroke-dasharray="12 8">
    <animateTransform attributeName="transform" type="rotate" from="0 870 120" to="360 870 120" dur="20s" repeatCount="indefinite"/>
  </circle>
  <circle cx="870" cy="120" r="58" stroke="#F59E0B" stroke-opacity="0.45" stroke-width="1.5" stroke-dasharray="6 6">
    <animateTransform attributeName="transform" type="rotate" from="360 870 120" to="0 870 120" dur="14s" repeatCount="indefinite"/>
  </circle>

  <!-- Pixelated / Geometric Cyber Fox Emblem -->
  <g transform="translate(830, 82)">
    <!-- Ears -->
    <polygon points="10,28 18,4 32,22" fill="#F59E0B"/>
    <polygon points="70,28 62,4 48,22" fill="#F59E0B"/>
    <polygon points="15,24 19,10 27,21" fill="#064E3B"/>
    <polygon points="65,24 61,10 53,21" fill="#064E3B"/>
    <!-- Head & Cheeks -->
    <polygon points="10,28 40,20 70,28 74,48 40,72 6,48" fill="#D97706"/>
    <polygon points="6,48 26,44 40,72" fill="#FEF3C7"/>
    <polygon points="74,48 54,44 40,72" fill="#FEF3C7"/>
    <!-- Glowing Pixel Emerald Eyes -->
    <rect x="23" y="38" width="6" height="6" fill="#10B981">
      <animate attributeName="fill" values="#10B981;#6EE7B7;#10B981" dur="2s" repeatCount="indefinite"/>
    </rect>
    <rect x="51" y="38" width="6" height="6" fill="#10B981">
      <animate attributeName="fill" values="#10B981;#6EE7B7;#10B981" dur="2s" repeatCount="indefinite"/>
    </rect>
    <!-- Pixel Nose -->
    <rect x="37" y="64" width="6" height="5" fill="#050807"/>
  </g>

  <!-- Top Tag with Blinking Cursor -->
  <text x="48" y="62" fill="#10B981" font-family="monospace" font-size="14" letter-spacing="2.5">
    // CURIOUS FOX • RESEARCH &amp; INTERDISCIPLINARY CODE
    <tspan fill="#FBBF24" font-weight="bold"> _
      <animate attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite"/>
    </tspan>
  </text>

  <!-- Gold Display Name -->
  <text x="48" y="128" fill="#FBBF24" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="46">
    PRIYAKRITI
  </text>

  <!-- Subtitle -->
  <text x="48" y="172" fill="#D1FAE5" font-family="monospace" font-size="16" opacity="0.92">
    Outfoxing complex problems across code &amp; research domains
  </text>

  <!-- Bottom Pixel Status Bar -->
  <rect x="48" y="194" width="8" height="8" fill="#10B981"/>
  <rect x="62" y="194" width="8" height="8" fill="#F59E0B"/>
  <rect x="76" y="194" width="8" height="8" fill="#10B981" opacity="0.5"/>
  <text x="94" y="202" fill="#6EE7B7" font-family="monospace" font-size="12" letter-spacing="1.5">
    SYS.STATUS: ONLINE // EXPLORING &amp; BUILDING
  </text>
</svg>
