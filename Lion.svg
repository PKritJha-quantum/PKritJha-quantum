<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <!-- Subtle Square Grid Pattern matching reference background -->
    <pattern id="techGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#182C20" stroke-width="1" />
    </pattern>

    <!-- Subtle Emerald Glow for Eyes -->
    <filter id="mintGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep Forest-Black Background & Grid -->
  <rect width="400" height="400" fill="#0B130E" rx="24" />
  <rect width="400" height="400" fill="url(#techGrid)" rx="24" />

  <!-- ================= LION GEOMETRIC EMBLEM ================= -->

  <!-- Outer Spiked Mane (Deep Burnt Rust & Rich Amber) -->
  <!-- Top Crown Spikes -->
  <polygon points="200,52 176,94 224,94" fill="#F59E0B" />
  <polygon points="200,52 200,94 224,94" fill="#D97706" />
  <polygon points="152,66 142,114 182,98" fill="#B45309" />
  <polygon points="248,66 258,114 218,98" fill="#92400E" />

  <!-- Upper Side Mane Blades -->
  <polygon points="98,95 140,114 118,162 78,142" fill="#D97706" />
  <polygon points="302,95 260,114 282,162 322,142" fill="#B45309" />

  <!-- Mid Side Mane Blades -->
  <polygon points="64,172 118,162 114,220 70,214" fill="#92400E" />
  <polygon points="336,172 282,162 286,220 330,214" fill="#78350F" />

  <!-- Lower Mane & Beard Spikes -->
  <polygon points="84,238 118,220 138,274 102,272" fill="#B45309" />
  <polygon points="316,238 282,220 262,274 298,272" fill="#92400E" />

  <polygon points="122,282 154,274 168,324 136,314" fill="#78350F" />
  <polygon points="278,282 246,274 232,324 264,314" fill="#632B0B" />
  <polygon points="200,348 172,308 228,308" fill="#92400E" />
  <polygon points="200,348 200,308 228,308" fill="#78350F" />

  <!-- Pointed Lion Ears (Amber Outer, Dark Emerald Inner) -->
  <polygon points="124,96 106,134 142,134" fill="#F59E0B" />
  <polygon points="124,106 114,130 135,130" fill="#0B3B2B" />

  <polygon points="276,96 294,134 258,134" fill="#D97706" />
  <polygon points="276,106 286,130 265,130" fill="#0B3B2B" />

  <!-- Forehead & Heavy Brow Facets -->
  <polygon points="200,92 140,122 152,166 200,150 248,166 260,122" fill="#E07A16" />
  <polygon points="200,92 172,130 200,150 228,130" fill="#F59E0B" />
  <!-- Forehead Emerald Diamond Accent -->
  <polygon points="200,106 194,120 200,132 206,120" fill="#10B981" />

  <!-- Cheekbone Facets -->
  <polygon points="140,122 118,188 158,222 170,172" fill="#C2610C" />
  <polygon points="260,122 282,188 242,222 230,172" fill="#A85108" />

  <!-- Fierce Angled Mint-Emerald Eyes -->
  <polygon points="144,158 176,170 164,180 140,168" fill="#2EE59D" filter="url(#mintGlow)" />
  <polygon points="256,158 224,170 236,180 260,168" fill="#2EE59D" filter="url(#mintGlow)" />

  <!-- Nose Bridge -->
  <polygon points="180,150 220,150 214,204 186,204" fill="#E07A16" />
  <polygon points="200,150 220,150 214,204 200,204" fill="#C2610C" />

  <!-- Cream-White Muzzle Cheeks (Matching Fox Reference) -->
  <polygon points="142,202 186,204 200,222 184,244 152,236" fill="#FEF3C7" />
  <polygon points="258,202 214,204 200,222 216,244 248,236" fill="#FDE68A" />

  <!-- Sharp Obsidian Black Nose -->
  <polygon points="186,204 214,204 200,222" fill="#090D0B" />

  <!-- Roaring Mouth Cavity -->
  <polygon points="168,242 232,242 220,278 180,278" fill="#090D0B" />

  <!-- Sharp Cream-White Fangs -->
  <!-- Upper Fangs -->
  <polygon points="170,242 182,242 176,268" fill="#FEF3C7" />
  <polygon points="230,242 218,242 224,268" fill="#FDE68A" />
  <!-- Lower Fangs -->
  <polygon points="178,278 187,278 182,260" fill="#FEF3C7" />
  <polygon points="222,278 213,278 218,260" fill="#FDE68A" />

  <!-- Cream-White & Amber Chin Plate -->
  <polygon points="162,278 238,278 218,308 182,308" fill="#FEF3C7" />
  <polygon points="200,278 238,278 218,308 200,308" fill="#FDE68A" />
</svg>
