<svg xmlns="http://w3.org" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <!-- Vibrant Modern Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#311042" />
    </linearGradient>

    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <linearGradient id="earGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F472B6" />
      <stop offset="100%" stop-color="#FB923C" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2DD4BF" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Circle -->
  <circle cx="200" cy="200" r="185" fill="url(#bgGrad)" />
  <circle cx="200" cy="200" r="175" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1.5" stroke-dasharray="6 6" />

  <!-- Decorative Accent Shapes -->
  <circle cx="95" cy="110" r="6" fill="#F472B6" opacity="0.8" />
  <circle cx="315" cy="140" r="4" fill="#38BDF8" opacity="0.8" />
  <circle cx="290" cy="95" r="8" fill="#FB923C" opacity="0.6" />

  <!-- Ground Shadow -->
  <ellipse cx="205" cy="325" rx="95" ry="12" fill="#0F0D26" opacity="0.7" />

  <!-- Back Legs -->
  <path d="M 155 245 L 155 315 C 155 320, 180 320, 180 315 L 180 245 Z" fill="#4F46E5" />
  <path d="M 225 245 L 225 315 C 225 320, 250 320, 250 315 L 250 245 Z" fill="#4F46E5" />

  <!-- Tail -->
  <path d="M 122 195 Q 95 215 102 250" fill="none" stroke="#818CF8" stroke-width="5" stroke-linecap="round" />
  <path d="M 102 250 L 95 262 L 108 260 Z" fill="#F472B6" />

  <!-- Main Body -->
  <path d="M 120 205 
           C 120 140, 165 115, 225 125 
           C 265 130, 285 165, 280 215 
           C 278 245, 255 260, 225 260 
           L 155 260 
           C 130 260, 120 235, 120 205 Z" 
        fill="url(#bodyGrad)" />

  <!-- Front Legs -->
  <path d="M 140 235 L 140 318 C 140 324, 168 324, 168 318 L 168 235 Z" fill="url(#accentGrad)" />
  <path d="M 210 235 L 210 318 C 210 324, 238 324, 238 318 L 238 235 Z" fill="url(#accentGrad)" />

  <!-- Toenails -->
  <path d="M 143 321 A 4 4 0 0 1 151 321 Z" fill="#E0F2FE" />
  <path d="M 155 321 A 4 4 0 0 1 163 321 Z" fill="#E0F2FE" />
  <path d="M 213 321 A 4 4 0 0 1 221 321 Z" fill="#E0F2FE" />
  <path d="M 225 321 A 4 4 0 0 1 233 321 Z" fill="#E0F2FE" />

  <!-- Head & Trunk -->
  <path d="M 215 125 
           C 265 120, 295 145, 295 185 
           C 295 215, 295 255, 315 260 
           C 328 263, 335 250, 328 240 
           C 324 235, 318 240, 320 245 
           C 322 250, 315 252, 312 246 
           C 305 230, 312 195, 280 195 
           C 265 195, 255 215, 235 215 
           C 210 215, 195 170, 215 125 Z" 
        fill="url(#bodyGrad)" />

  <!-- Decorative Forehead Mandala/Crown -->
  <path d="M 262 135 L 270 145 L 262 155 L 254 145 Z" fill="#FDE047" filter="url(#glow)" />
  <circle cx="262" cy="145" r="2.5" fill="#1E1B4B" />

  <!-- Stylized Ear -->
  <path d="M 222 138 
           C 185 125, 165 155, 175 192 
           C 182 218, 212 222, 228 202 
           C 238 190, 235 150, 222 138 Z" 
        fill="url(#earGrad)" />

  <!-- Inner Ear Detail -->
  <path d="M 216 148 
           C 192 140, 180 160, 187 185 
           C 192 202, 210 205, 220 192 Z" 
        fill="#1E1B4B" opacity="0.25" />

  <!-- Tusk -->
  <path d="M 268 198 Q 295 218 318 195 Q 295 205 272 190 Z" fill="#F8FAFC" />

  <!-- Eye -->
  <circle cx="268" cy="166" r="6" fill="#0F172A" />
  <circle cx="270" cy="164" r="2" fill="#FFFFFF" />

  <!-- Cheek Blush -->
  <ellipse cx="255" cy="180" rx="7" ry="4" fill="#F472B6" opacity="0.6" />
</svg>
