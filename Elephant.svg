<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <!-- Dark Metallic Gradients -->
    <linearGradient id="bgDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090B" />
      <stop offset="100%" stop-color="#18181B" />
    </linearGradient>

    <linearGradient id="armorLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>

    <linearGradient id="armorDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Emerald Glow Gradient -->
    <linearGradient id="emeraldGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- Metallic Gold Border Gradient -->
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="40%" stop-color="#D97706" />
      <stop offset="70%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>

    <linearGradient id="tuskMetal" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94A3B8" />
      <stop offset="50%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>

    <filter id="emeraldNeon" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#bgDark)" rx="24" />

  <!-- Sharp Outer Hexagonal Golden Shield Frame -->
  <polygon points="200,18 358,104 358,286 200,382 42,286 42,104" 
           fill="none" stroke="url(#goldBorder)" stroke-width="3.5" />
  <polygon points="200,30 346,111 346,279 200,370 54,279 54,111" 
           fill="#0F172A" stroke="url(#goldBorder)" stroke-width="1.5" stroke-opacity="0.75" />

  <!-- Left Winged Ear (Angular Armor Plates) -->
  <polygon points="135,105 55,80 40,155 85,220 130,190" fill="url(#armorDark)" stroke="#09090B" stroke-width="2" />
  <polygon points="135,105 70,95 62,150 118,165" fill="url(#armorLight)" />
  <polygon points="118,165 62,150 92,205 128,185" fill="#0F172A" />
  <!-- Emerald Ear Trim -->
  <polyline points="55,80 40,155 85,220" fill="none" stroke="#10B981" stroke-width="3" filter="url(#emeraldNeon)" />

  <!-- Right Winged Ear (Angular Armor Plates) -->
  <polygon points="265,105 345,80 360,155 315,220 270,190" fill="url(#armorDark)" stroke="#09090B" stroke-width="2" />
  <polygon points="265,105 330,95 338,150 282,165" fill="url(#armorLight)" />
  <polygon points="282,165 338,150 308,205 272,185" fill="#0F172A" />
  <!-- Emerald Ear Trim -->
  <polyline points="345,80 360,155 315,220" fill="none" stroke="#10B981" stroke-width="3" filter="url(#emeraldNeon)" />

  <!-- Skull Crown & Brow Ridge -->
  <polygon points="200,60 135,105 150,155 200,135 250,155 265,105" fill="url(#armorLight)" stroke="url(#goldBorder)" stroke-width="1.5" />
  <polygon points="200,60 165,115 200,135 235,115" fill="#64748B" />
  
  <!-- Glowing Emerald Forehead Core -->
  <polygon points="200,82 190,105 200,122 210,105" fill="#10B981" filter="url(#emeraldNeon)" />
  <polygon points="200,88 194,105 200,116 206,105" fill="#A7F3D0" />

  <!-- Cheekbone Armor Plates -->
  <polygon points="135,105 115,175 155,215 165,160" fill="url(#armorDark)" stroke="#09090B" stroke-width="2" />
  <polygon points="265,105 285,175 245,215 235,160" fill="url(#armorDark)" stroke="#09090B" stroke-width="2" />

  <!-- Fierce Angled Emerald Eyes -->
  <polygon points="142,148 175,162 162,172 138,160" fill="#10B981" filter="url(#emeraldNeon)" />
  <polygon points="150,153 170,162 161,167" fill="#FFFFFF" />
  
  <polygon points="258,148 225,162 238,172 262,160" fill="#10B981" filter="url(#emeraldNeon)" />
  <polygon points="250,153 230,162 239,167" fill="#FFFFFF" />

  <!-- Massive Sweeping Tusks -->
  <!-- Left Tusk -->
  <path d="M 155 205 Q 90 235 65 160 Q 105 205 165 188 Z" fill="url(#tuskMetal)" stroke="#09090B" stroke-width="2" />
  <path d="M 155 205 Q 95 232 65 160 Q 102 215 160 196 Z" fill="#64748B" />

  <!-- Right Tusk -->
  <path d="M 245 205 Q 310 235 335 160 Q 295 205 235 188 Z" fill="url(#tuskMetal)" stroke="#09090B" stroke-width="2" />
  <path d="M 245 205 Q 305 232 335 160 Q 298 215 240 196 Z" fill="#64748B" />

  <!-- Segmented Armored Trunk -->
  <!-- Upper Bridge -->
  <polygon points="165,155 200,135 235,155 225,200 175,200" fill="url(#armorLight)" stroke="#09090B" stroke-width="2" />
  <!-- Segment 1 -->
  <polygon points="175,200 225,200 220,240 180,240" fill="url(#armorDark)" stroke="#09090B" stroke-width="2" />
  <line x1="182" y1="205" x2="218" y2="205" stroke="#10B981" stroke-width="2" />
  <!-- Segment 2 -->
  <polygon points="180,240 220,240 214,280 186,280" fill="url(#armorLight)" stroke="#09090B" stroke-width="2" />
  <line x1="186" y1="245" x2="214" y2="245" stroke="#10B981" stroke-width="2" />
  <!-- Segment 3 -->
  <polygon points="186,280 214,280 208,320 192,320" fill="url(#armorDark)" stroke="#09090B" stroke-width="2" />
  <!-- Trunk Tip -->
  <polygon points="192,320 208,320 200,348" fill="url(#emeraldGlow)" />
</svg>
