<svg width="1000" height="220" viewBox="0 0 1000 220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Deep Obsidian & Emerald Background -->
    <linearGradient id="bg" x1="0" y1="0" x2="1000" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#060908"/>
      <stop offset="55%" stop-color="#0B1914"/>
      <stop offset="100%" stop-color="#120F07"/>
    </linearGradient>

    <!-- Animated Emerald-Gold Border Gradient -->
    <linearGradient id="goldBorder" x1="0" y1="0" x2="1000" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981">
        <animate attributeName="stop-color" values="#10B981;#F59E0B;#10B981" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#F59E0B">
        <animate attributeName="stop-color" values="#F59E0B;#10B981;#F59E0B" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#10B981">
        <animate attributeName="stop-color" values="#10B981;#F59E0B;#10B981" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
  </defs>

  <!-- Card Base -->
  <rect width="1000" height="220" rx="14" fill="url(#bg)"/>
  <rect x="2" y="2" width="996" height="216" rx="12" stroke="url(#goldBorder)" stroke-width="2"/>

  <!-- Rotating Outer Emerald Ring -->
  <circle cx="885" cy="110" r="68" stroke="#10B981" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="14 8">
    <animateTransform attributeName="transform" type="rotate" from="0 885 110" to="360 885 110" dur="18s" repeatCount="indefinite"/>
  </circle>

  <!-- Counter-Rotating Inner Gold Ring -->
  <circle cx="885" cy="110" r="46" stroke="#F59E0B" stroke-opacity="0.55" stroke-width="1.5" stroke-dasharray="8 6">
    <animateTransform attributeName="transform" type="rotate" from="360 885 110" to="0 885 110" dur="12s" repeatCount="indefinite"/>
  </circle>

  <!-- Pulsing Center Core -->
  <circle cx="885" cy="110" r="8" fill="#10B981">
    <animate attributeName="r" values="6;10;6" dur="2.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.4;1" dur="2.5s" repeatCount="indefinite"/>
  </circle>

  <!-- Top Tag with Blinking Terminal Cursor -->
  <text x="50" y="58" fill="#10B981" font-family="monospace" font-size="14" letter-spacing="2.5">
    // CURIOUS FOX • RESEARCH &amp; INTERDISCIPLINARY CODE
    <tspan fill="#FBBF24" font-weight="bold"> _
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </tspan>
  </text>

  <!-- Main Gold Display Name -->
  <text x="50" y="122" fill="#FBBF24" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="46">
    PRIYAKRITI
  </text>

  <!-- Subtitle -->
  <text x="50" y="166" fill="#D1FAE5" font-family="monospace" font-size="17" opacity="0.9">
    Connecting software engineering with cross-disciplinary curiosity 🦊
  </text>
</svg>
